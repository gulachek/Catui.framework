name: Release
on:
  release:
    types: [published]
jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: script/install-deps.sh
      - run: script/test-pkg.sh
      - run: script/upload-package.sh
